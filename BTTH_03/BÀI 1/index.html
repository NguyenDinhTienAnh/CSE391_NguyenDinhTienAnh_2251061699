<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Quản Lý Sinh Viên</h1>

        <!-- Khu vực thông báo -->
        <div id="notificationArea" class="notification hidden"></div>

        <!-- Các nút điều khiển & Thống kê -->
        <section class="top-controls">
            <button id="btnOpenAddForm" class="btn btn-primary">Thêm sinh viên</button>
            <div class="stats">
                <p>Tổng số: <strong id="totalStudents">0</strong></p>
                <p>Điểm TB lớp: <strong id="avgClassScore">0.0</strong></p>
            </div>
        </section>

        <!-- Bảng hiển thị dữ liệu -->
        <section class="table-container">
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Mã SV</th>
                        <th>Họ và tên</th>
                        <th>Ngày sinh</th>
                        <th>Lớp</th>
                        <th>Email</th>
                        <th>Điểm TB</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="studentBody">
                    <!-- Dữ liệu render bằng JS sẽ nằm ở đây -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Modal Form (Dùng chung cho Thêm & Sửa) -->
    <div id="studentModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm sinh viên mới</h2>
            <form id="studentForm">
                
                <input type="hidden" id="editingIndex" value="-1">
                
                <div class="form-group">
                    <label for="studentId">Mã sinh viên:</label>
                    <input type="text" id="studentId" required>
                </div>
                <div class="form-group">
                    <label for="fullName">Họ và tên:</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label for="dob">Ngày sinh:</label>
                    <input type="date" id="dob" required>
                </div>
                <div class="form-group">
                    <label for="className">Lớp học:</label>
                    <input type="text" id="className" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="avgScore">Điểm trung bình:</label>
                    <input type="number" id="avgScore" step="0.1" min="0" max="10" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" id="btnSubmit" class="btn btn-primary">Lưu dữ liệu</button>
                    <button type="button" id="btnCloseModal" class="btn btn-secondary">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
