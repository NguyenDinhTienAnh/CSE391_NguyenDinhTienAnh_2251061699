<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions & Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div class="container">
        <h2>Loading Spinner Animation</h2>
      
        <div class="spinner"></div>

        <h2>Product Card Animations</h2>
     
        <div class="card fade-in-scroll">
            
        
            <div class="img-container">
                <img src="https://www.shutterstock.com/pt/image-photo/ny-usa-june-2-2025-black-2646140967?trackingId=ef2919f0-7658-4428-916c-12d1ad399536&listId=searchResults" alt="Sản phẩm demo">
            </div>
            
            <div class="card-content">
                <h3>Sản phẩm cao cấp</h3>
                <p class="price">2.500.000 ₫</p>
                
            
                <button class="buy-btn">Mua ngay</button>
            </div>
        </div>
        
    
        <div style="height: 100vh; padding-top: 50px;">
            <p style="text-align: center; color: #888;">(Cuộn xuống để xem hiệu ứng fade-in bằng CSS)</p>
        </div>
        
        <div class="card fade-in-scroll">
            <div class="img-container">
                <img src="https://via.placeholder.com/300x250/eeeeee/333333?text=Product+Image+2" alt="Sản phẩm 2">
            </div>
            <div class="card-content">
                <h3>Sản phẩm Cuộn (Scroll Test)</h3>
                <p class="price">3.000.000 ₫</p>
                <button class="buy-btn">Mua ngay</button>
            </div>
        </div>

    </div>

</body>
</html>
