<!DOCTYPE html>
<html lang="vi">

    <title>Debug CSS Layout</title>

</head>
<body>

    <h2>Cách 1: Dùng Border-box (Khuyên dùng)</h2>

        <div class="sidebar">Sidebar 300px</div>

        <div class="content">Content (đã trừ padding/border)</div>
    </div>

</body>
